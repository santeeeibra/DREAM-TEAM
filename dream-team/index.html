<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Dream Team</title>
  </head>
  <body style="margin:0; background:#0f0f1a; color:white; font-family:sans-serif;">

    <div id="auth-container" style="max-width:300px; margin:100px auto; display:flex; flex-direction:column; gap:10px;">
      <h2>Dream Team ⚽</h2>
      <input id="email" type="email" placeholder="email" style="padding:8px;" />
      <input id="password" type="password" placeholder="contraseña" style="padding:8px;" />
      <button id="btn-login" style="padding:10px;">Ingresar</button>
      <button id="btn-signup" style="padding:10px;">Crear cuenta</button>
      <p id="auth-error" style="color:#ff4d4d; margin:0; font-size:14px;"></p>
    </div>

    <div id="game-container" style="display:none; justify-content:center;"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
