<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Dream Team — Modo Carrera DT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/ui/cartas.css">
<style>
:root{
  --noche:#080B09; --cancha:#0E1712; --panel:#121D17; --linea:rgba(233,255,240,.10);
  --papel:#EFE9DB; --tiza:#EAF2EC; --humo:#7E8F85;
  --fluor:#FF5E1A; --led:#6FE39A; --rojo:#FF4A4A; --ambar:#FFC24B;
  --r:4px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(120% 60% at 50% -10%, #16281E 0%, transparent 60%),
    repeating-linear-gradient(90deg, transparent 0 46px, rgba(255,255,255,.014) 46px 92px),
    var(--noche);
  color:var(--tiza); font-family:'Barlow',system-ui,sans-serif; font-size:16px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
#app{max-width:940px;margin:0 auto;padding:20px 18px 80px}
h1,h2,h3,.display{font-family:'Anton',Impact,sans-serif;font-weight:400;letter-spacing:.01em;text-transform:uppercase;line-height:.95}
h1{font-size:clamp(38px,8vw,68px)}
h2{font-size:clamp(24px,4.4vw,36px)}
h3{font-size:19px}
.eyebrow{font-family:'Barlow Condensed';font-weight:700;text-transform:uppercase;letter-spacing:.22em;font-size:12px;color:var(--humo)}
.num{font-family:'Barlow Condensed';font-weight:700;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.btn{
  display:inline-flex;align-items:center;gap:10px;padding:13px 20px;border-radius:var(--r);
  background:var(--fluor);color:#0B0704;font-family:'Barlow Condensed';font-weight:700;
  text-transform:uppercase;letter-spacing:.09em;font-size:18px;
  transition:transform .12s ease, filter .12s ease; box-shadow:0 0 0 0 rgba(255,94,26,.5);
}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--tiza);box-shadow:inset 0 0 0 1px var(--linea)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1px var(--fluor);color:var(--fluor)}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
input,select{
  background:var(--cancha);border:1px solid var(--linea);border-radius:var(--r);
  padding:12px 14px;color:var(--tiza);font:inherit;width:100%
}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--fluor);outline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--linea);border-radius:var(--r);padding:18px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.sep{height:1px;background:var(--linea);margin:6px 0}
.muted{color:var(--humo)}

/* ── dropdowns del onboarding (país y club) ── */
.dropdown{position:relative}
.dd-btn{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:var(--cancha);border:1px solid var(--linea);border-radius:var(--r);
  padding:12px 14px;color:var(--tiza);font:inherit;cursor:pointer;line-height:1.45
}
.dd-btn:hover{border-color:var(--fluor)}
.dd-btn:disabled{opacity:.35;cursor:not-allowed;border-color:var(--linea)}
.dd-btn.dd-placeholder{color:var(--humo)}
.dd-caret{margin-left:auto;color:var(--humo);font-size:12px}
.dd-opciones{
  position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:30;
  max-height:264px;overflow-y:auto;list-style:none;padding:6px;
  display:flex;flex-direction:column;gap:2px;border-radius:var(--r);
  background:var(--panel);border:1px solid var(--linea);
  box-shadow:0 14px 34px rgba(0,0,0,.55)
}
.dd-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:3px;cursor:pointer;font-size:15px}
.dd-item:hover{background:rgba(255,94,26,.10);color:var(--fluor)}
.dd-item.activo{color:var(--fluor);font-weight:700;background:rgba(255,94,26,.06)}
.flag{width:22px;height:15px;object-fit:cover;border-radius:2px;box-shadow:0 0 0 1px rgba(255,255,255,.14)}
.escudo{width:22px;height:22px;object-fit:contain;flex:none}
.liga-logo{width:26px;height:26px;object-fit:contain;flex:none}

/* ── SIGNATURE: el marcador ── */
.marcador{
  position:sticky;top:0;z-index:20;margin:-20px -18px 18px;padding:10px 18px;
  background:
    radial-gradient(120% 110% at 85% -30%,rgba(255,94,26,.16),transparent 55%),
    linear-gradient(180deg,rgba(8,11,9,.97),rgba(8,11,9,.86));
  border-bottom:1px solid var(--linea);backdrop-filter:blur(8px);
}
.marcador::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--fluor),transparent);opacity:.55}
.marcador .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.marcador .club{font-family:'Anton';font-size:17px;text-transform:uppercase;display:flex;align-items:center;gap:8px;text-shadow:0 0 16px rgba(255,94,26,.28)}
.marcador .club .escudo{width:24px;height:24px}
/* meta chips + stepper de temporadas del marcador */
.ts-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.ts-steps{display:flex;gap:3px}
.ts-steps i{width:6px;height:6px;border-radius:99px;background:rgba(255,255,255,.14);transition:background .25s,box-shadow .25s}
.ts-steps i.done{background:var(--fluor);box-shadow:0 0 8px rgba(255,94,26,.55)}
.ts-steps i.on{background:var(--fluor);box-shadow:0 0 0 1px var(--fluor),0 0 12px rgba(255,94,26,.85);animation:tsPulso 2.2s ease-in-out infinite}
@keyframes tsPulso{0%,100%{opacity:1}50%{opacity:.5}}
.ts-chip{font-family:'Barlow Condensed';font-weight:700;font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--humo);border:1px solid rgba(233,255,240,.10);
  border-radius:99px;padding:2px 8px;white-space:nowrap}
.ts-chip b{color:var(--tiza);font-weight:700}
.ts-guia{padding:2px 9px;font-size:13px;flex:none}
.gauges{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px}
.gauge{position:relative}
.gauge-head{display:flex;justify-content:space-between;align-items:baseline;gap:4px}
.gauge .lbl{font-family:'Barlow Condensed';font-weight:700;font-size:10px;letter-spacing:.14em;color:var(--humo);text-transform:uppercase}
.gauge .val{font-family:'Barlow Condensed';font-weight:700;font-size:20px;line-height:1;font-variant-numeric:tabular-nums}
.gauge .bar{height:6px;background:rgba(255,255,255,.09);margin-top:5px;border-radius:2px;overflow:hidden}
.gauge .bar i{display:block;height:100%;background:var(--led);width:0;transition:width .6s cubic-bezier(.2,.7,.2,1);border-radius:2px}
.gauge.warn .bar i{background:var(--ambar)} .gauge.bad .bar i{background:var(--rojo)}
.gauge-foot{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.gauge .dir{font-family:'Barlow Condensed';font-size:9.5px;color:var(--humo);letter-spacing:.06em;text-transform:uppercase;opacity:.65}
.gauge.warn .dir{color:var(--ambar);opacity:1} .gauge.bad .dir{color:var(--rojo);opacity:1}
.gauge .delta{font-family:'Barlow Condensed';font-weight:700;font-size:13px;opacity:0}
.gauge .delta.on{animation:flotar 1.6s ease forwards}
@keyframes flotar{0%{opacity:0;transform:translateY(6px)}18%{opacity:1;transform:translateY(0)}75%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
.pos{color:var(--led)} .neg{color:var(--rojo)}

/* cinta de fixture */
.cinta{display:flex;gap:2px;margin-top:10px}
.cinta i{flex:1;height:6px;background:rgba(255,255,255,.07);border-radius:1px;transition:background .3s}
.cinta i.G{background:var(--led)} .cinta i.E{background:var(--humo)} .cinta i.P{background:var(--rojo)}
.cinta i.hoy{box-shadow:0 0 0 1px var(--fluor),0 0 10px rgba(255,94,26,.5)}

/* cartas: estilos del componente en src/ui/cartas.css (importado desde main.js) */
.pen-vecino-tx{color:var(--ambar)}
.pen-fuera-tx{color:#D6402E}
.aviso{border-left:3px solid var(--ambar);padding:8px 12px;background:rgba(0,0,0,.25);font-size:13px;margin:0}

/* once */
.cancha-grid{display:grid;gap:10px;background:
  linear-gradient(180deg,rgba(111,227,154,.05),transparent),var(--cancha);
  border:1px solid var(--linea);padding:14px;border-radius:var(--r)}
.linea-f{display:grid;gap:8px;grid-auto-flow:column;justify-content:center}
.slot{
  min-width:78px;padding:8px 6px;text-align:center;border:1px dashed var(--linea);border-radius:3px;
  background:rgba(0,0,0,.25);cursor:pointer;transition:border-color .15s,background .15s
}
.slot:hover{border-color:var(--fluor)}
.slot.activo{border-color:var(--fluor);background:rgba(255,94,26,.10)}
.slot .sl{font-family:'Barlow Condensed';font-weight:700;font-size:10px;letter-spacing:.14em;color:var(--humo)}
.slot .sn{font-family:'Barlow Condensed';font-weight:700;font-size:13px;text-transform:uppercase;line-height:1.05}
.slot .sr{font-family:'Anton';font-size:18px}
.slot.vecino .sr{color:var(--ambar)}
.slot.fuera .sr{color:#D6402E}
.slot.vacio{border-style:dashed;border-color:var(--ambar)}
.slot.vacio .sn{color:var(--ambar)}

/* evento */
.evento{border-left:3px solid var(--fluor);animation:entrar .35s cubic-bezier(.2,.8,.2,1)}
@keyframes entrar{from{opacity:0;transform:translateY(10px)}}

/* leyenda fija de variables, siempre visible arriba de las opciones */
.leyenda-vars{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.leyenda-item{
  flex:none;display:flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.03);border:1px solid var(--linea);border-radius:99px;
  padding:6px 12px 6px 9px;font-size:12.5px;color:var(--humo);
}
.leyenda-item b{color:var(--tiza);font-weight:700;margin-right:2px}
.li-ico{font-size:14px;line-height:1}

/* tarjeta de opción: cabecera clickeable (elige) + toggle separado (detalle) */
.opcion-card{border:1px solid var(--linea);border-radius:var(--r);background:rgba(255,255,255,.02);overflow:hidden}
.opcion-main{
  display:block;width:100%;text-align:left;padding:14px;background:transparent;
  transition:border-color .15s,background .15s;
}
.opcion-main:hover{background:rgba(255,94,26,.06)}
.opcion-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.opcion-label{font-weight:600}
.riesgo-tag{font-family:'Barlow Condensed';font-size:11px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--ambar);white-space:nowrap}
.riesgo-tag.directo{color:var(--humo)}
.expected-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.opcion-toggle{
  display:block;width:100%;text-align:center;padding:9px;font-family:'Barlow Condensed';
  font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--humo);
  border-top:1px solid var(--linea);background:rgba(255,255,255,.015);transition:color .15s,background .15s;
}
.opcion-toggle:hover{color:var(--fluor);background:rgba(255,94,26,.06)}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{font-family:'Barlow Condensed';font-weight:700;font-size:13px;letter-spacing:.04em;
  padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.06)}
.chip.pos{color:var(--led)} .chip.neg{color:var(--rojo)}
.consecuencias{display:flex;flex-direction:column;gap:6px;padding:12px 14px;background:rgba(0,0,0,.15)}
/* split bar */
.split-bar-wrap{margin-bottom:8px}
.split-bar{display:flex;height:5px;border-radius:3px;overflow:hidden;gap:3px}
.split-seg{height:100%;border-radius:3px;background:rgba(255,255,255,.15);transition:flex .3s}
.split-seg.top{background:var(--fluor)}
/* resultado bloque */
.res-bloque{background:rgba(255,255,255,.04);border-radius:6px;padding:8px 10px;border:1px solid transparent}
.res-bloque.top{border-color:rgba(255,94,26,.25)}
.res-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.res-label{font-family:'Barlow Condensed';font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--humo)}
.res-label.top{color:var(--fluor)}
.prob-badge{font-family:'Anton';font-size:11px;color:rgba(255,255,255,.35);background:rgba(255,255,255,.06);padding:1px 6px;border-radius:3px}
.sin-cambios{color:var(--humo);font-size:12px}
/* stat rows */
.stat-rows{display:flex;flex-direction:column;gap:5px}
.stat-row{display:grid;grid-template-columns:64px 1fr 32px;align-items:center;gap:8px}
.stat-lbl{font-family:'Barlow Condensed';font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--humo)}
.stat-track{height:4px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
.stat-fill{height:100%;border-radius:2px}
.stat-fill.pos{background:var(--led)}.stat-fill.neg{background:var(--rojo)}
.stat-val{font-family:'Barlow Condensed';font-weight:700;font-size:13px;text-align:right}
.stat-val.pos{color:var(--led)}.stat-val.neg{color:var(--rojo)}

/* goleadores / asistencias */
.goleadores-row{align-items:flex-start;gap:20px}
.goleadores-col{flex:1;min-width:180px}

/* tabla */
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-family:'Barlow Condensed';font-weight:700;text-transform:uppercase;letter-spacing:.12em;
  font-size:11px;color:var(--humo);text-align:left;padding:6px 8px;border-bottom:1px solid var(--linea)}
td{padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.045)}
tr.mio td{background:rgba(255,94,26,.12);font-weight:700}
td.n{text-align:right;font-family:'Barlow Condensed';font-weight:700;font-variant-numeric:tabular-nums}
.partido{display:flex;justify-content:space-between;gap:10px;padding:7px 10px;border-bottom:1px solid rgba(255,255,255,.05);font-size:14px}
.eq{display:flex;align-items:center;gap:8px}
.res-fila{display:flex;align-items:center;gap:10px}
.res{font-family:'Anton';font-size:15px;width:22px;text-align:center}
.res.G{color:var(--led)} .res.E{color:var(--humo)} .res.P{color:var(--rojo)}
.hint{font-size:13px;color:var(--humo)}
@media (max-width:560px){
  .gauges{grid-template-columns:repeat(3,1fr)}
  .linea-f{grid-auto-flow:row;grid-template-columns:repeat(4,1fr)}
}
/* ── Onboarding v2: crear DT — noche de estadio, un solo foco de neón ── */
.ob-wrap{padding-top:8vh}
.ob-hero{max-width:34ch;margin-bottom:26px}
.ob-h1{line-height:.92;margin:8px 0 10px}
.ob-h1-glow{background:linear-gradient(100deg,var(--fluor) 10%,#ffb020 90%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 16px rgba(255,94,26,.4))}
.ob-sub{color:var(--humo);font-size:14.5px;max-width:38ch;margin:0}
.ob-steps{display:flex;align-items:center;gap:9px;margin-top:20px;flex-wrap:wrap}
.ob-step{display:flex;align-items:center;gap:7px;font-family:'Barlow Condensed';font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--humo);transition:color .25s}
.ob-step i{width:7px;height:7px;border-radius:99px;background:rgba(255,255,255,.14);transition:background .25s,box-shadow .25s}
.ob-step.done{color:var(--fluor)}
.ob-step.done i{background:var(--fluor);box-shadow:0 0 10px rgba(255,94,26,.7)}
.ob-step-arrow{width:22px;height:1px;background:rgba(255,255,255,.12)}
.ob-step-arrow::before{content:"";display:block;width:100%;height:100%;background:linear-gradient(90deg,rgba(255,94,26,0),rgba(255,94,26,.65));transform:scaleX(0);transform-origin:left;transition:transform .3s}
.ob-step.done + .ob-step-arrow::before{transform:scaleX(1)}
.ob-layout{display:grid;grid-template-columns:minmax(0,1fr) 288px;gap:20px;align-items:start}
.ob-form{width:100%}
.ob-liga{display:inline-flex;align-items:center;gap:9px;padding:11px 15px;border-radius:var(--r);background:var(--cancha);border:1px solid var(--linea);color:var(--tiza);font-family:'Barlow Condensed';font-weight:700;font-size:15px;letter-spacing:.05em;text-transform:uppercase;transition:transform .15s ease,border-color .15s,color .15s,box-shadow .15s}
.ob-liga:hover{border-color:var(--fluor);color:var(--fluor);transform:translateY(-1px)}
.ob-liga.activo{border-color:var(--fluor);background:rgba(255,94,26,.10);color:var(--fluor);box-shadow:0 0 0 1px rgba(255,94,26,.35),0 0 18px -4px rgba(255,94,26,.45)}
.ob-liga.activo .liga-logo{filter:drop-shadow(0 0 6px rgba(255,94,26,.5))}
.ob-seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border:1px solid var(--linea);border-radius:var(--r);background:rgba(0,0,0,.28)}
.ob-seg-btn{padding:9px 10px;border-radius:2px;font-family:'Barlow Condensed';font-weight:700;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--humo);transition:color .18s,background .18s,box-shadow .18s}
.ob-seg-btn:hover{color:var(--tiza)}
.ob-seg-btn.activo{background:var(--fluor);color:#0B0704;box-shadow:0 0 14px -2px rgba(255,94,26,.6)}
.ob-cta{position:relative;overflow:hidden;justify-content:center;width:100%;margin-top:4px}
.ob-cta::after{content:"";position:absolute;top:0;bottom:0;left:0;width:34%;pointer-events:none;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:translateX(-170%) skewX(-18deg);animation:obShine 3.8s ease-in-out infinite}
.ob-cta:disabled::after{display:none}
@keyframes obShine{0%{transform:translateX(-170%) skewX(-18deg)}55%,100%{transform:translateX(430%) skewX(-18deg)}}
/* ficha viva del DT */
.ob-ficha{position:sticky;top:18px;display:flex;flex-direction:column;padding:18px;overflow:hidden;
  background:radial-gradient(120% 90% at 85% -10%,rgba(255,94,26,.14),transparent 55%),var(--panel);
  border:1px solid var(--linea);border-radius:var(--r)}
.ob-ficha::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;opacity:.4;
  background:linear-gradient(90deg,transparent,var(--fluor),transparent);transition:opacity .5s}
.ob-ficha.lista::before{opacity:.95;animation:obPulse 2.6s ease-in-out infinite}
@keyframes obPulse{0%,100%{opacity:.45}50%{opacity:1}}
.ob-ficha-id{display:flex;align-items:center;gap:12px;padding-bottom:14px}
.ob-ficha-avatar{position:relative;width:58px;height:58px;flex:none;border-radius:99px;display:flex;align-items:center;justify-content:center;
  background:var(--cancha);border:1px solid var(--linea);transition:border-color .3s,box-shadow .3s}
.ob-ficha-avatar span{font-family:'Anton';font-size:26px;line-height:1;color:var(--humo);transition:color .3s,text-shadow .3s}
.ob-ficha.lista .ob-ficha-avatar{border-color:rgba(255,94,26,.6);box-shadow:0 0 18px -2px rgba(255,94,26,.4)}
.ob-ficha.lista .ob-ficha-avatar span{color:var(--fluor);text-shadow:0 0 10px rgba(255,94,26,.55)}
.ob-ficha-nombre-wrap{min-width:0}
.ob-ficha-nombre{font-family:'Anton';font-size:22px;line-height:1.05;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ob-ficha-fila{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid rgba(255,255,255,.05);font-size:14px}
.ob-ficha-lbl{font-family:'Barlow Condensed';font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--humo);flex:none}
.ob-ficha-val{display:flex;align-items:center;gap:6px;font-weight:600;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ob-ficha-val .flag{width:26px;height:18px}
.ob-ficha-val .escudo{width:24px;height:24px}
.ob-ficha-pie{margin-top:10px;padding-top:12px;border-top:1px solid var(--linea)}
.ob-ficha-sobre{display:inline-flex;align-items:center;gap:6px;font-family:'Barlow Condensed';font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--led);border:1px solid rgba(111,227,154,.35);border-radius:99px;padding:4px 10px;background:rgba(111,227,154,.08)}
/* entrada única (se dispara una vez por carga de página, no en cada render) */
.ob-anim .ob-hero{animation:obEnt .55s cubic-bezier(.2,.75,.25,1) both}
.ob-anim .ob-form{animation:obEnt .55s cubic-bezier(.2,.75,.25,1) .08s both}
.ob-anim .ob-ficha{animation:obEnt .55s cubic-bezier(.2,.75,.25,1) .16s both}
@keyframes obEnt{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

@media (max-width:860px){
  .ob-layout{grid-template-columns:1fr}
  .ob-ficha{position:static}
}
@media (max-width:560px){
  .ob-wrap{padding-top:4vh}
  .ob-cta::after{display:none}
}
/* ── Temporada v2: noche de estadio — el mismo foco de neón que el onboarding ── */
.ts-anim .marcador{animation:tsEnt .55s cubic-bezier(.2,.75,.25,1) both}
.ts-anim .ts-tramo{animation:tsEnt .55s cubic-bezier(.2,.75,.25,1) .06s both}
.ts-anim .ts-panel{animation:tsEnt .55s cubic-bezier(.2,.75,.25,1) .12s both}
@keyframes tsEnt{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.ts-tramo{position:relative;overflow:hidden;
  background:radial-gradient(120% 90% at 85% -10%,rgba(255,94,26,.12),transparent 55%),var(--panel)}
.ts-tramo::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;opacity:.5;
  background:linear-gradient(90deg,transparent,var(--fluor),transparent)}
.ts-tramo-tag{display:inline-flex;align-items:center;gap:8px;font-family:'Barlow Condensed';
  font-weight:700;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--fluor)}
.ts-tramo-tag i{width:7px;height:7px;border-radius:99px;background:var(--fluor);
  box-shadow:0 0 10px rgba(255,94,26,.8);animation:tsPulso 2.2s ease-in-out infinite}
.ts-glow{background:linear-gradient(100deg,var(--fluor) 10%,#FFB020 90%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px rgba(255,94,26,.35))}
.ts-panel{position:relative;overflow:hidden;
  background:radial-gradient(120% 90% at 85% -10%,rgba(255,94,26,.07),transparent 55%),var(--panel)}
.ts-panel::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;opacity:.45;
  background:linear-gradient(90deg,transparent,var(--fluor),transparent)}
.ts-tabla{animation:tsEnt .4s cubic-bezier(.2,.75,.25,1) both}
.ts-panel tr.mio td{background:rgba(255,94,26,.10);box-shadow:inset 2px 0 0 var(--fluor)}
.ts-panel .goleadores-col tbody tr:first-child td.n{color:var(--fluor);text-shadow:0 0 8px rgba(255,94,26,.65)}
.ts-cta{position:relative;overflow:hidden}
.ts-cta::after{content:"";position:absolute;top:0;bottom:0;left:0;width:34%;pointer-events:none;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);
  transform:translateX(-170%) skewX(-18deg);animation:obShine 3.8s ease-in-out infinite}
.ts-cta:disabled::after{display:none}
@media (max-width:560px){
  .ts-cta::after{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/ui/main.js"></script>
</body>
</html>
