<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Manrope:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <title>Dream Team</title>
  </head>
  <body>
    <div id="auth-container" class="pantalla-centrada">
      <h1>Dream Team ⚽</h1>
      <input id="auth-email" type="email" placeholder="Email" autocomplete="email" />
      <div class="campo-password">
        <input id="auth-password" type="password" placeholder="Contraseña" autocomplete="current-password" />
        <button
          type="button"
          id="btn-toggle-password"
          class="boton-ojo"
          title="Mostrar contraseña"
          aria-label="Mostrar contraseña"
        >
          👁
        </button>
      </div>
      <button id="btn-login">Ingresar</button>
      <button id="btn-signup" class="boton-secundario">Crear cuenta</button>
      <button id="btn-guest" class="boton-secundario">Jugar como invitado</button>
      <p id="auth-error" class="mensaje-error"></p>
    </div>

    <div id="manager-form-container" class="pantalla-centrada" style="display: none">
      <h1>Creá tu DT</h1>
      <input id="manager-name" type="text" placeholder="Nombre del DT" />
      <!-- Dropdowns personalizados (CustomSelect, ver src/ui/CustomSelect.js):
           reemplazan a los <select> nativos para poder mostrar bandera/escudo
           junto a cada opción. Las opciones se generan e insertan en main.js
           a partir de src/data/countries.js y src/data/leagues.js; los tres
           arrancan vacíos y deshabilitados hasta que main.js los llena. -->
      <div id="manager-country"></div>
      <div id="manager-league"></div>
      <div id="manager-club"></div>
      <button id="btn-create-manager">Crear DT y abrir sobres</button>
      <p id="manager-error" class="mensaje-error"></p>
    </div>

    <div id="app"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
