<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dream Team</title>
  </head>
  <body>
    <div id="auth-container" class="pantalla-centrada">
      <h1>Dream Team ⚽</h1>
      <input id="auth-email" type="email" placeholder="Email" autocomplete="email" />
      <div class="campo-password">
        <input id="auth-password" type="password" placeholder="Contraseña" autocomplete="current-password" />
        <button
          type="button"
          id="btn-toggle-password"
          class="boton-ojo"
          title="Mostrar contraseña"
          aria-label="Mostrar contraseña"
        >
          👁
        </button>
      </div>
      <button id="btn-login">Ingresar</button>
      <button id="btn-signup" class="boton-secundario">Crear cuenta</button>
      <button id="btn-guest" class="boton-secundario">Jugar como invitado</button>
      <p id="auth-error" class="mensaje-error"></p>
    </div>

    <div id="manager-form-container" class="pantalla-centrada" style="display: none">
      <h1>Creá tu DT</h1>
      <input id="manager-name" type="text" placeholder="Nombre del DT" />
      <!-- Select de país: las <option> se generan en main.js a partir de
           src/data/countries.js, no están hardcodeadas acá. -->
      <select id="manager-country">
        <option value="" disabled selected>Elegí tu país</option>
      </select>
      <!-- Select de liga: las <option> también se generan en main.js a
           partir de src/data/leagues.js. -->
      <select id="manager-league">
        <option value="" disabled selected>Elegí la liga</option>
      </select>
      <!-- Select de club: arranca deshabilitado porque depende de la liga
           elegida; main.js lo llena y lo habilita cuando cambia el select
           de liga. -->
      <select id="manager-club" disabled>
        <option value="" disabled selected>Elegí el club</option>
      </select>
      <button id="btn-create-manager">Crear DT y abrir sobres</button>
      <p id="manager-error" class="mensaje-error"></p>
    </div>

    <div id="app"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
